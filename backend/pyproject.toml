[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "career-network-optimizer"
version = "0.1.0"
description = "FastAPI & NetworkX engine for career network topology and warm pathfinding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "networkx>=3.2.1",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "numpy>=1.26.0",
    "sqlite-utils>=3.36"
]
